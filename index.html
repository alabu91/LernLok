<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LernLok</title>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#75c93b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="LernLok" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #eef1ef;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }
  #root { min-height: 100vh; }

  .fdv-app {
    /* ================= Farb-Palette ================= */
    --bg: #eef1ef;
    --panel: #ffffff;
    --panel-border: #e3e8e4;
    --panel-alt: #f5f8f6;
    --text: #1b231f;
    --text-dim: #6a746e;

    --green: #6cc12c;
    --green-light: #8ed94f;
    --green-dark: #4a931c;
    --green-dim: #eef9e2;
    --on-green: #12240a;
    --green-ring: rgba(108, 193, 44, 0.28);

    --red: #e04b3d;
    --red-light: #ec6457;
    --red-dim: #fdecea;
    --on-red: #ffffff;

    --amber: #d18f21;
    --amber-dim: #fcf3e2;

    --grey: #8b948f;
    --grey-dark: #46504a;
    --pick: #46504a;
    --on-pick: #ffffff;
    --border-strong: #cfd6d1;

    /* ================= Form ================= */
    --radius: 14px;
    --radius-sm: 10px;
    --radius-xs: 8px;

    /* ================= Schatten ================= */
    --shadow-xs: 0 1px 2px rgba(18, 28, 22, 0.05);
    --shadow-sm: 0 1px 2px rgba(18, 28, 22, 0.05), 0 3px 10px rgba(18, 28, 22, 0.05);
    --shadow-md: 0 2px 6px rgba(18, 28, 22, 0.05), 0 12px 28px rgba(18, 28, 22, 0.08);
    --shadow-green: 0 4px 16px rgba(108, 193, 44, 0.28);

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background:
      radial-gradient(900px 420px at 50% -10%, #ffffff 0%, rgba(255, 255, 255, 0) 62%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    width: 100%;
    box-sizing: border-box;
    padding: calc(18px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) calc(44px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    max-width: 680px;
    margin: 0 auto;
  }
  .fdv-app * { box-sizing: border-box; }

  button, input, select, textarea { font-family: inherit; }
  button { touch-action: manipulation; }

  /* ================= Kopfbereich ================= */
  .fdv-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 2px;
  }
  .fdv-title {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
    line-height: 1.15;
  }
  .fdv-title::before {
    content: "";
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--green-light), var(--green-dark));
    box-shadow: 0 0 0 4px var(--green-dim);
    flex-shrink: 0;
  }
  .fdv-sub {
    color: var(--text-dim);
    font-size: 13.5px;
    line-height: 1.5;
    margin: 8px 0 20px;
  }
  .fdv-railline {
    height: 3px;
    border-radius: 2px;
    background: repeating-linear-gradient(90deg, var(--green) 0 12px, transparent 12px 20px);
    opacity: 0.32;
    margin-bottom: 20px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent);
  }

  /* ================= Training-Buttons ================= */
  .fdv-training-row {
    display: flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .fdv-training-btn {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 15px 14px;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    font-size: 13px;
    min-height: 74px;
    box-shadow: var(--shadow-xs);
    transition: transform 0.12s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .fdv-training-btn:hover { border-color: rgba(108, 193, 44, 0.5); box-shadow: var(--shadow-sm); background: var(--panel); }
  .fdv-training-btn:active { transform: scale(0.975); box-shadow: var(--shadow-xs); }
  .fdv-training-btn.disabled {
    opacity: 0.45;
    cursor: default;
    pointer-events: none;
    box-shadow: none;
  }
  .fdv-training-btn .label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 5px;
    letter-spacing: -0.01em;
  }
  .fdv-training-btn .label::before {
    content: "";
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 7px;
    vertical-align: 1.5px;
    background: var(--grey);
    transition: box-shadow 0.18s ease;
  }
  .fdv-training-row .fdv-training-btn:first-child .label::before {
    background: var(--green);
    box-shadow: 0 0 0 3px var(--green-dim);
  }
  .fdv-training-row .fdv-training-btn:nth-child(2) .label::before {
    background: var(--amber);
    box-shadow: 0 0 0 3px var(--amber-dim);
  }
  .fdv-training-btn .meta {
    color: var(--text-dim);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  /* ================= Kapitel ================= */
  .fdv-section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-weight: 700;
    color: var(--text-dim);
    margin: 26px 0 10px;
  }
  .fdv-chapter-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .fdv-chapter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-xs);
    padding: 13px 15px;
    cursor: pointer;
    width: 100%;
    text-align: left;
    color: var(--text);
    font-size: 14px;
    min-height: 56px;
    transition: box-shadow 0.18s ease, border-color 0.18s ease, transform 0.12s ease, background 0.18s ease;
  }
  .fdv-chapter-row:hover {
    border-color: rgba(108, 193, 44, 0.5);
    background: var(--panel);
    box-shadow: var(--shadow-sm);
  }
  .fdv-chapter-row:active { transform: scale(0.99); }
  .fdv-chapter-code {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 12.5px;
    color: var(--green-dark);
    background: var(--green-dim);
    border-radius: 7px;
    padding: 5px 9px;
    min-width: 44px;
    text-align: center;
    flex-shrink: 0;
    letter-spacing: 0.01em;
  }
  .fdv-chapter-title {
    flex: 1;
    font-size: 14px;
    line-height: 1.35;
  }
  .fdv-mastery {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .fdv-mastery-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), 0 0 0 3px rgba(20, 30, 25, 0.045);
  }
  .fdv-mastery-text {
    font-size: 11.5px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    min-width: 36px;
    text-align: right;
    font-weight: 600;
  }

  /* ================= Quiz ================= */
  .fdv-quiz-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .fdv-back-btn {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    border-radius: 9px;
    padding: 8px 13px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    min-height: 38px;
    box-shadow: var(--shadow-xs);
    transition: color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  .fdv-back-btn:hover { color: var(--text); border-color: rgba(108, 193, 44, 0.55); }
  .fdv-back-btn:active { transform: scale(0.97); }
  .fdv-quiz-title {
    font-size: 13px;
    color: var(--text-dim);
    flex: 1;
    font-weight: 500;
    line-height: 1.35;
  }
  .fdv-progress-track {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
  }
  .fdv-progress-tick {
    height: 5px;
    flex: 1;
    border-radius: 3px;
    background: var(--panel-border);
    transition: background 0.25s ease;
  }
  .fdv-progress-tick.current { background: var(--grey-dark); }
  .fdv-progress-tick.correct { background: var(--green); }
  .fdv-progress-tick.wrong { background: var(--red); }

  /* ================= Karte ================= */
  .fdv-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    padding: 22px 18px;
    box-shadow: var(--shadow-md);
  }
  .fdv-type-tag {
    display: inline-block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    font-weight: 700;
    color: var(--green-dark);
    background: var(--green-dim);
    border: none;
    border-radius: 20px;
    padding: 4px 10px;
    margin-bottom: 10px;
  }
  .fdv-question-image {
    display: block;
    width: auto;
    max-width: 100%;
    max-height: 200px;
    object-fit: contain;
    background: var(--panel-alt);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 6px;
    margin: 0 auto 16px;
  }
  .fdv-question {
    font-size: 17.5px;
    font-weight: 600;
    line-height: 1.45;
    letter-spacing: -0.01em;
    margin: 0 0 18px;
  }

  /* ================= Antwortoptionen ================= */
  .fdv-options {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .fdv-options-row { flex-direction: row; }
  .fdv-option {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel-alt);
    border: 1.5px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 14px 15px;
    color: var(--text);
    font-size: 14.5px;
    text-align: left;
    cursor: pointer;
    line-height: 1.4;
    min-height: 52px;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
  }
  .fdv-option-tf { flex: 1; justify-content: center; }
  .fdv-option:hover:not(.locked) {
    border-color: rgba(108, 193, 44, 0.6);
    background: var(--panel);
  }
  .fdv-option:active:not(.locked) { transform: scale(0.99); }
  .fdv-option.picked {
    border-color: var(--pick);
    background: var(--panel);
    box-shadow: 0 0 0 3px rgba(70, 80, 74, 0.09);
  }
  .fdv-option.locked { cursor: default; }
  .fdv-option.correct-answer {
    border-color: var(--green);
    background: var(--green-dim);
    box-shadow: 0 0 0 3px rgba(108, 193, 44, 0.14);
  }
  .fdv-option.wrong-answer {
    border-color: var(--red);
    background: var(--red-dim);
    box-shadow: 0 0 0 3px rgba(224, 75, 61, 0.12);
  }
  .fdv-option-light {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    background: var(--panel);
    flex-shrink: 0;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .fdv-option:hover:not(.locked) .fdv-option-light { border-color: var(--green); }
  .fdv-option.picked .fdv-option-light { background: var(--pick); border-color: var(--pick); }
  .fdv-option.correct-answer .fdv-option-light { background: var(--green); border-color: var(--green); }
  .fdv-option.wrong-answer .fdv-option-light { background: var(--red); border-color: var(--red); }

  .fdv-checkbox-box {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid var(--border-strong);
    background: var(--panel);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: transparent;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }
  .fdv-option:hover:not(.locked) .fdv-checkbox-box { border-color: var(--green); }
  .fdv-checkbox-box.checked {
    background: var(--pick);
    border-color: var(--pick);
    color: var(--on-pick);
  }
  .fdv-option.correct-answer .fdv-checkbox-box {
    background: var(--green);
    border-color: var(--green);
    color: var(--on-green);
  }
  .fdv-option.wrong-answer .fdv-checkbox-box {
    background: var(--red);
    border-color: var(--red);
    color: var(--on-red);
  }

  /* ================= Wahr/Falsch-Matrix ================= */
  .fdv-tfm-table { display: flex; flex-direction: column; gap: 9px; }
  .fdv-tfm-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--panel-alt);
    border: 1.5px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 12px 13px;
  }
  .fdv-tfm-text { flex: 1; font-size: 14px; line-height: 1.45; }
  .fdv-tfm-choices { display: flex; gap: 7px; flex-shrink: 0; }
  .fdv-tfm-pill {
    border: 1.5px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    border-radius: 9px;
    padding: 9px 12px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    min-height: 40px;
    transition: all 0.15s ease;
  }
  .fdv-tfm-pill:hover:not(.locked) { border-color: rgba(108, 193, 44, 0.6); }
  .fdv-tfm-pill:active:not(.locked) { transform: scale(0.97); }
  .fdv-tfm-pill.picked {
    border-color: var(--pick);
    background: var(--pick);
    color: var(--on-pick);
  }
  .fdv-tfm-pill.locked { cursor: default; }
  .fdv-tfm-pill.correct-answer {
    border-color: var(--green);
    background: var(--green);
    color: var(--on-green);
  }
  .fdv-tfm-pill.wrong-answer {
    border-color: var(--red);
    background: var(--red);
    color: var(--on-red);
  }

  /* ================= Zuordnung ================= */
  .fdv-matching { display: flex; flex-direction: column; gap: 10px; }
  .fdv-matching-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 9px;
    background: var(--panel-alt);
    border: 1.5px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 12px 13px;
  }
  .fdv-matching-left {
    font-size: 14px;
    font-weight: 700;
    min-width: 90px;
    line-height: 1.35;
  }
  .fdv-matching-select {
    flex: 1;
    min-width: 150px;
    background-color: var(--panel);
    color: var(--text);
    border: 1.5px solid var(--panel-border);
    border-radius: 9px;
    padding: 10px 32px 10px 11px;
    font-size: 13.5px;
    min-height: 44px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .fdv-matching-select:focus {
    outline: none;
    border-color: var(--green);
    box-shadow: 0 0 0 4px var(--green-ring);
  }
  .fdv-matching-select.correct-answer { border-color: var(--green); background-color: var(--green-dim); }
  .fdv-matching-select.wrong-answer { border-color: var(--red); background-color: var(--red-dim); }
  .fdv-matching-solution {
    width: 100%;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--green-dark);
    line-height: 1.4;
  }

  /* ================= Buttons im Quiz ================= */
  .fdv-check-btn {
    margin-top: 20px;
    width: 100%;
    background: var(--panel-alt);
    color: var(--text-dim);
    border: 1.5px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 15px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    min-height: 54px;
    transition: filter 0.15s ease, transform 0.1s ease, box-shadow 0.2s ease, background 0.2s ease;
  }
  .fdv-check-btn.enabled {
    background: linear-gradient(135deg, var(--green-light), var(--green));
    color: var(--on-green);
    border-color: transparent;
    box-shadow: var(--shadow-green);
  }
  .fdv-check-btn.enabled:hover { filter: brightness(1.05); }
  .fdv-check-btn.enabled:active { transform: scale(0.99); }
  .fdv-check-btn:disabled { opacity: 0.55; cursor: default; }

  .fdv-next-btn {
    margin-top: 18px;
    width: 100%;
    background: linear-gradient(135deg, var(--green-light), var(--green));
    color: var(--on-green);
    border: none;
    border-radius: var(--radius-sm);
    padding: 15px;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    min-height: 54px;
    box-shadow: var(--shadow-green);
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  .fdv-next-btn:hover { filter: brightness(1.05); }
  .fdv-next-btn:active { transform: scale(0.99); }

  .fdv-prev-btn {
    background: var(--panel-alt);
    border: 1.5px solid var(--panel-border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 15px 18px;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    min-height: 54px;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .fdv-prev-btn:hover { border-color: var(--grey); background: var(--panel); }
  .fdv-prev-btn:active { transform: scale(0.99); }

  .fdv-explanation {
    margin-top: 16px;
    padding: 13px 14px;
    background: var(--panel-alt);
    border-left: 3px solid var(--green);
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    color: var(--text-dim);
    line-height: 1.55;
  }
  .fdv-explanation strong { color: var(--text); }

  /* ================= Ergebnis ================= */
  .fdv-result-score {
    font-size: 54px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.035em;
    line-height: 1;
    margin: 10px 0 4px;
  }
  .fdv-result-sub {
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 26px;
  }
  .fdv-result-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .fdv-result-btn {
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: 1.5px solid var(--panel-border);
    background: var(--panel);
    color: var(--text);
    min-height: 52px;
    transition: all 0.18s ease;
  }
  .fdv-result-btn:hover { border-color: var(--grey); }
  .fdv-result-btn:active { transform: scale(0.99); }
  .fdv-result-btn.primary {
    background: linear-gradient(135deg, var(--green-light), var(--green));
    color: var(--on-green);
    border: none;
    font-weight: 700;
    box-shadow: var(--shadow-green);
  }
  .fdv-result-btn.primary:hover { filter: brightness(1.05); border: none; }
  .fdv-result-btn.warn {
    background: linear-gradient(135deg, var(--red-light), var(--red));
    color: var(--on-red);
    border: none;
    font-weight: 700;
    box-shadow: 0 4px 16px rgba(224, 75, 61, 0.28);
  }
  .fdv-result-btn.warn:hover { filter: brightness(1.05); border: none; }

  /* ================= Login / Formulare ================= */
  .fdv-login-wrap {
    max-width: 380px;
    margin: clamp(24px, 8vh, 72px) auto 0;
  }
  .fdv-login-card { margin-top: 16px; }
  .fdv-label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    color: var(--text-dim);
    margin: 16px 0 6px;
  }
  .fdv-label:first-child { margin-top: 0; }
  .fdv-input {
    width: 100%;
    background: var(--panel-alt);
    border: 1.5px solid var(--panel-border);
    border-radius: var(--radius-sm);
    padding: 12px 13px;
    font-size: 16px;
    color: var(--text);
    font-family: inherit;
    min-height: 48px;
    -webkit-appearance: none;
    appearance: none;
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }
  .fdv-input:focus {
    outline: none;
    border-color: var(--green);
    background: var(--panel);
    box-shadow: 0 0 0 4px var(--green-ring);
  }
  textarea.fdv-input { min-height: 0; line-height: 1.45; resize: vertical; }
  select.fdv-input, .fdv-matching-select {

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

const sb = window.sb;

const TYPE_LABEL = {
  sc: "Single Choice",
  ms: "Multiple Select",
  tf: "Wahr / Falsch",
  tfm: "Wahr/Falsch-Matrix",
  matching: "Zuordnung",
};

function shuffledCopy(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function shuffledIndices(n) {
  return shuffledCopy(Array.from({ length: n }, (_, i) => i));
}

function randomizeQuestion(q) {
  if (q.type === "sc") {
    const order = shuffledIndices(q.options.length);
    return { ...q, options: order.map((i) => q.options[i]), correctIndex: order.indexOf(q.correctIndex) };
  }
  if (q.type === "ms") {
    const order = shuffledIndices(q.options.length);
    return {
      ...q,
      options: order.map((i) => q.options[i]),
      correctIndices: q.correctIndices.map((ci) => order.indexOf(ci)),
    };
  }
  if (q.type === "tfm") {
    return { ...q, statements: shuffledCopy(q.statements) };
  }
  if (q.type === "matching") {
    return { ...q, pairs: shuffledCopy(q.pairs) };
  }
  return q;
}

function chapterStats(chapter, progress) {
  let attempted = 0;
  let correct = 0;
  chapter.questions.forEach((q) => {
    const p = progress[q.id];
    if (p) {
      attempted += 1;
      if (p.last_correct) correct += 1;
    }
  });
  return { attempted, correct, total: chapter.questions.length };
}

function masteryColor(stats) {
  if (stats.attempted === 0) return "var(--grey)";
  const ratio = stats.correct / stats.attempted;
  if (stats.attempted < stats.total) return "var(--amber)";
  if (ratio >= 0.8) return "var(--green)";
  if (ratio >= 0.5) return "var(--amber)";
  return "var(--red)";
}

// row from Supabase `questions` table -> app-shaped question object
function rowToQuestion(row) {
  const base = {
    id: row.id,
    type: row.type,
    prompt: row.prompt,
    explanation: row.explanation || "",
  };
  if (row.image) base.image = row.image;
  if (row.source) base.source = row.source;
  return { ...base, ...row.payload };
}

// ---- draft helpers ----
function initDraft(q) {
  if (q.type === "sc") return { selected: null };
  if (q.type === "tf") return { selected: null };
  if (q.type === "ms") return { selectedSet: [] };
  if (q.type === "tfm") return { answers: q.statements.map(() => null) };
  if (q.type === "matching") return { assign: q.pairs.map(() => null), pool: shuffledCopy(q.pairs.map((p) => p.right)) };
  return {};
}
function isDraftComplete(q, draft) {
  if (q.type === "sc" || q.type === "tf") return draft.selected !== null;
  if (q.type === "ms") return draft.selectedSet.length > 0;
  if (q.type === "tfm") return draft.answers.every((a) => a !== null);
  if (q.type === "matching") return draft.assign.every((a) => a !== null);
  return false;
}
function isDraftCorrect(q, draft) {
  if (q.type === "sc") return draft.selected === q.correctIndex;
  if (q.type === "tf") return draft.selected === q.correct;
  if (q.type === "ms") {
    const a = [...draft.selectedSet].sort().join(",");
    const b = [...q.correctIndices].sort().join(",");
    return a === b;
  }
  if (q.type === "tfm") return q.statements.every((s, i) => draft.answers[i] === s.correct);
  if (q.type === "matching") return q.pairs.every((p, i) => draft.assign[i] === p.right);
  return false;
}

// ---- per-type interactive renderers ----
function ScQuestion({ q, draft, setDraft, revealed }) {
  return (
    <div className="fdv-options">
      {q.options.map((opt, idx) => {
        let cls = "fdv-option";
        if (revealed) {
          cls += " locked";
          if (idx === q.correctIndex) cls += " correct-answer";
          else if (idx === draft.selected) cls += " wrong-answer";
        } else if (draft.selected === idx) cls += " picked";
        return (
          <button key={idx} className={cls} disabled={revealed} onClick={() => setDraft({ selected: idx })}>
            <span className="fdv-option-light" />
            <span>{opt}</span>
          </button>
        );
      })}
    </div>
  );
}
function TfQuestion({ q, draft, setDraft, revealed }) {
  const options = [{ label: "Wahr", value: true }, { label: "Falsch", value: false }];
  return (
    <div className="fdv-options fdv-options-row">
      {options.map((opt) => {
        let cls = "fdv-option fdv-option-tf";
        if (revealed) {
          cls += " locked";
          if (opt.value === q.correct) cls += " correct-answer";
          else if (opt.value === draft.selected) cls += " wrong-answer";
        } else if (draft.selected === opt.value) cls += " picked";
        return (
          <button key={opt.label} className={cls} disabled={revealed} onClick={() => setDraft({ selected: opt.value })}>
            <span className="fdv-option-light" />
            <span>{opt.label}</span>
          </button>
        );
      })}
    </div>
  );
}
function MsQuestion({ q, draft, setDraft, revealed }) {
  function toggle(idx) {
    if (revealed) return;
    const set = draft.selectedSet.includes(idx) ? draft.selectedSet.filter((i) => i !== idx) : [...draft.selectedSet, idx];
    setDraft({ selectedSet: set });
  }
  return (
    <div className="fdv-options">
      {q.options.map((opt, idx) => {
        const picked = draft.selectedSet.includes(idx);
        const shouldBeCorrect = q.correctIndices.includes(idx);
        let cls = "fdv-option fdv-option-checkbox";
        if (revealed) {
          cls += " locked";
          if (shouldBeCorrect) cls += " correct-answer";
          else if (picked) cls += " wrong-answer";
        } else if (picked) cls += " picked";
        return (
          <button key={idx} className={cls} disabled={revealed} onClick={() => toggle(idx)}>
            <span className={"fdv-checkbox-box" + (picked ? " checked" : "")}>{picked ? "✓" : ""}</span>
            <span>{opt}</span>
          </button>
        );
      })}
    </div>
  );
}
function TfmQuestion({ q, draft, setDraft, revealed }) {
  function setRow(i, val) {
    if (revealed) return;
    const answers = [...draft.answers];
    answers[i] = val;
    setDraft({ answers });
  }
  return (
    <div className="fdv-tfm-table">
      {q.statements.map((s, i) => (
        <div className="fdv-tfm-row" key={i}>
          <div className="fdv-tfm-text">{s.text}</div>
          <div className="fdv-tfm-choices">
            {[true, false].map((val) => {
              let cls = "fdv-tfm-pill";
              if (revealed) {
                cls += " locked";
                if (val === s.correct) cls += " correct-answer";
                else if (draft.answers[i] === val) cls += " wrong-answer";
              } else if (draft.answers[i] === val) cls += " picked";
              return (
                <button key={String(val)} className={cls} disabled={revealed} onClick={() => setRow(i, val)}>
                  {val ? "Wahr" : "Falsch"}
                </button>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}
function MatchingQuestion({ q, draft, setDraft, revealed }) {
  function setAssign(i, value) {
    if (revealed) return;
    const assign = [...draft.assign];
    assign[i] = value || null;
    setDraft({ ...draft, assign });
  }
  return (
    <div className="fdv-matching">
      {q.pairs.map((p, i) => {
        const val = draft.assign[i];
        const correct = revealed && val === p.right;
        const wrong = revealed && val !== p.right;
        return (
          <div className="fdv-matching-row" key={i}>
            <div className="fdv-matching-left">{p.left}</div>
            <select
              className={"fdv-matching-select" + (correct ? " correct-answer" : wrong ? " wrong-answer" : "")}
              disabled={revealed}
              value={val || ""}
              onChange={(e) => setAssign(i, e.target.value)}
            >
              <option value="" disabled>wählen …</option>
              {draft.pool.map((opt, oi) => (
                <option key={oi} value={opt}>{opt}</option>
              ))}
            </select>
            {revealed && wrong && <div className="fdv-matching-solution">Richtig: {p.right}</div>}
          </div>
        );
      })}
    </div>
  );
}
function QuestionBody({ q, draft, setDraft, revealed }) {
  if (q.type === "sc") return <ScQuestion q={q} draft={draft} setDraft={setDraft} revealed={revealed} />;
  if (q.type === "tf") return <TfQuestion q={q} draft={draft} setDraft={setDraft} revealed={revealed} />;
  if (q.type === "ms") return <MsQuestion q={q} draft={draft} setDraft={setDraft} revealed={revealed} />;
  if (q.type === "tfm") return <TfmQuestion q={q} draft={draft} setDraft={setDraft} revealed={revealed} />;
  if (q.type === "matching") return <MatchingQuestion q={q} draft={draft} setDraft={setDraft} revealed={revealed} />;
  return null;
}

// ---- Forced password change screen (shown after first login with a temp password) ----
function ForcePasswordChangeScreen({ onDone }) {
  const [pw1, setPw1] = useState("");
  const [pw2, setPw2] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setError("");
    if (pw1.length < 6) {
      setError("Das Passwort muss mindestens 6 Zeichen haben.");
      return;
    }
    if (pw1 !== pw2) {
      setError("Die beiden Passwörter stimmen nicht überein.");
      return;
    }
    setBusy(true);
    const { error: updErr } = await sb.auth.updateUser({
      password: pw1,
      data: { must_change_password: false },
    });
    setBusy(false);
    if (updErr) {
      setError("Fehler beim Setzen des Passworts: " + updErr.message);
      return;
    }
    onDone();
  }

  return (
    <div className="fdv-app">
      <div className="fdv-login-wrap">
        <h1 className="fdv-title">Neues Passwort setzen</h1>
        <p className="fdv-sub">Aus Sicherheitsgründen musst du beim ersten Login ein eigenes Passwort vergeben.</p>
        <form className="fdv-card fdv-login-card" onSubmit={submit}>
          <label className="fdv-label">Neues Passwort</label>
          <input className="fdv-input" type="password" required value={pw1} onChange={(e) => setPw1(e.target.value)} />
          <label className="fdv-label">Neues Passwort wiederholen</label>
          <input className="fdv-input" type="password" required value={pw2} onChange={(e) => setPw2(e.target.value)} />
          {error && <div className="fdv-form-error">{error}</div>}
          <button className="fdv-next-btn" type="submit" disabled={busy}>
            {busy ? "Speichern …" : "Passwort setzen"}
          </button>
        </form>
      </div>
    </div>
  );
}

// ---- Admin screen: create a new user with a temporary password ----
function AddUserScreen({ accessToken, onCancel }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [success, setSuccess] = useState(null);

  async function submit(e) {
    e.preventDefault();
    setError("");
    setSuccess(null);
    if (!email.trim() || password.length < 6) {
      setError("Bitte E-Mail und ein Passwort mit mindestens 6 Zeichen angeben.");
      return;
    }
    setBusy(true);
    try {
      const res = await fetch("https://nsidzovmagohzuwvikev.supabase.co/functions/v1/admin-create-user", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + accessToken,
        },
        body: JSON.stringify({ email: email.trim(), password }),
      });
      const data = await res.json();
      if (!res.ok) {
        setError(data.error || "Unbekannter Fehler beim Erstellen des Nutzers.");
      } else {
        setSuccess(data.user.email);
        setEmail("");
        setPassword("");
      }
    } catch (err) {
      setError("Verbindungsfehler: " + err.message);
    }
    setBusy(false);
  }

  return (
    <div className="fdv-card">
      <span className="fdv-type-tag">Neuer Nutzer</span>
      <form onSubmit={submit}>
        <label className="fdv-label">E-Mail</label>
        <input className="fdv-input" type="email" value={email} onChange={(e) => setEmail(e.target.value)} />
        <label className="fdv-label">Temporäres Passwort</label>
        <input className="fdv-input" type="text" value={password} onChange={(e) => setPassword(e.target.value)} />
        {error && <div className="fdv-form-error">{error}</div>}
        {success && <div className="fdv-explanation"><strong>Erstellt.</strong> {success} kann sich jetzt mit dem temporären Passwort einloggen und muss danach sofort ein eigenes setzen.</div>}
        <div className="fdv-form-actions">
          <button type="button" className="fdv-result-btn" onClick={onCancel}>Zurück</button>
          <button type="submit" className="fdv-result-btn primary" disabled={busy}>
            {busy ? "Erstellen …" : "Nutzer erstellen"}
          </button>
        </div>
      </form>
    </div>
  );
}

// ---- Login screen ----
function LoginScreen({ onLoggedIn }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setBusy(true);
    setError("");
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    setBusy(false);
    if (error) {
      setError("Login fehlgeschlagen. E-Mail/Passwort prüfen.");
      return;
    }
    onLoggedIn(data.session);
  }

  return (
    <div className="fdv-app">
      <div className="fdv-login-wrap">
        <h1 className="fdv-title">LernLok</h1>
        <p className="fdv-sub">Melde dich mit deinem Zugang an.</p>
        <form className="fdv-card fdv-login-card" onSubmit={submit}>
          <label className="fdv-label">E-Mail</label>
          <input className="fdv-input" type="email" required value={email} onChange={(e) => setEmail(e.target.value)} />
          <label className="fdv-label">Passwort</label>
          <input className="fdv-input" type="password" required value={password} onChange={(e) => setPassword(e.target.value)} />
          {error && <div className="fdv-form-error">{error}</div>}
          <button className="fdv-next-btn" type="submit" disabled={busy}>
            {busy ? "Einloggen …" : "Einloggen"}
          </button>
        </form>
        <p className="fdv-sub" style={{ marginTop: 16 }}>
          Noch keinen Zugang? Frag die Person, die diese App verwaltet, um ein Konto.
        </p>
      </div>
    </div>
  );
}

// ---- Add-question form ----
function emptyFormForType(type) {
  if (type === "sc") return { options: ["", "", "", ""], correctIndex: 0 };
  if (type === "ms") return { options: ["", "", "", ""], correctFlags: [false, false, false, false] };
  if (type === "tf") return { correct: true };
  if (type === "tfm") return { statements: [{ text: "", correct: true }, { text: "", correct: true }, { text: "", correct: true }, { text: "", correct: true }] };
  if (type === "matching") return { pairs: [{ left: "", right: "" }, { left: "", right: "" }, { left: "", right: "" }, { left: "", right: "" }] };
  return {};
}

function padTo(arr, n, filler) {
  const a = [...arr];
  while (a.length < n) a.push(filler());
  return a;
}

// Build form state from an existing question (used when editing).
function formFromQuestion(q) {
  if (q.type === "sc") return { options: padTo(q.options, 4, () => ""), correctIndex: q.correctIndex };
  if (q.type === "ms") {
    const options = padTo(q.options, 4, () => "");
    return { options, correctFlags: options.map((_, i) => q.correctIndices.includes(i)) };
  }
  if (q.type === "tf") return { correct: q.correct };
  if (q.type === "tfm") return { statements: padTo(q.statements.map((s) => ({ ...s })), 4, () => ({ text: "", correct: true })) };
  if (q.type === "matching") return { pairs: padTo(q.pairs.map((p) => ({ ...p })), 4, () => ({ left: "", right: "" })) };
  return emptyFormForType(q.type);
}

function AddQuestionScreen({ chapters, userId, editing, onDone, onCancel }) {
  const [chapterCode, setChapterCode] = useState(editing ? editing.chapterCode : (chapters[0]?.code || ""));
  const [type, setType] = useState(editing ? editing.question.type : "sc");
  const [prompt, setPrompt] = useState(editing ? editing.question.prompt : "");
  const [image, setImage] = useState(editing ? (editing.question.image || "") : "");
  const [explanation, setExplanation] = useState(editing ? (editing.question.explanation || "") : "");
  const [source, setSource] = useState(editing ? (editing.question.source || "") : "");
  const [form, setForm] = useState(editing ? formFromQuestion(editing.question) : emptyFormForType("sc"));
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState("");

  function changeType(t) {
    setType(t);
    setForm(emptyFormForType(t));
  }

  function buildPayload() {
    if (type === "sc") {
      const kept = form.options.map((o, i) => ({ o, i })).filter((x) => x.o.trim() !== "");
      return { options: kept.map((x) => x.o), correctIndex: kept.findIndex((x) => x.i === form.correctIndex) };
    }
    if (type === "ms") {
      const kept = form.options.map((o, i) => ({ o, i })).filter((x) => x.o.trim() !== "");
      const correctIndices = kept.map((x, k) => (form.correctFlags[x.i] ? k : -1)).filter((k) => k >= 0);
      return { options: kept.map((x) => x.o), correctIndices };
    }
    if (type === "tf") {
      return { correct: form.correct };
    }
    if (type === "tfm") {
      return { statements: form.statements.filter((s) => s.text.trim() !== "") };
    }
    if (type === "matching") {
      return { pairs: form.pairs.filter((p) => p.left.trim() !== "" && p.right.trim() !== "") };
    }
    return {};
  }

  async function submit(e) {
    e.preventDefault();
    setError("");
    if (!chapterCode || !prompt.trim()) {
      setError("Bitte Kapitel und Frage ausfüllen.");
      return;
    }
    const payload = buildPayload();
    if (type === "sc" && (payload.options.length < 2 || payload.correctIndex < 0)) {
      setError("Bitte mindestens 2 Antwortoptionen ausfüllen und eine davon als richtig markieren.");
      return;
    }
    if (type === "ms" && (payload.options.length < 2 || payload.correctIndices.length < 1)) {
      setError("Bitte mindestens 2 Antwortoptionen ausfüllen und mindestens eine als richtig ankreuzen.");
      return;
    }
    if (type === "tfm" && payload.statements.length < 1) {
      setError("Bitte mindestens eine Teilaussage ausfüllen.");
      return;
    }
    if (type === "matching" && payload.pairs.length < 2) {
      setError("Bitte mindestens zwei vollständige Paare ausfüllen.");
      return;
    }
    setSaving(true);
    const fields = {
      chapter_code: chapterCode,
      type,
      prompt: prompt.trim(),
      image: image.trim() || null,
      explanation: explanation.trim(),
      source: source.trim() || null,
      payload,
    };
    if (editing) {
      const { data, error } = await sb.from("questions").update(fields).eq("id", editing.question.id).select();
      setSaving(false);
      if (error) {
        setError("Speichern fehlgeschlagen: " + error.message);
        return;
      }
      if (!data || data.length === 0) {
        setError("Die Änderung wurde nicht gespeichert (fehlende Berechtigung?).");
        return;
      }
      onDone();
      return;
    }
    const { error } = await sb.from("questions").insert({ ...fields, created_by: userId });
    setSaving(false);
    if (error) {
      setError("Speichern fehlgeschlagen: " + error.message);
      return;
    }
    onDone();
  }

  async function remove() {
    if (!editing) return;
    if (!window.confirm("Diese Frage in den Papierkorb verschieben?\n\nSie erscheint dann nicht mehr im Training, kann aber im Papierkorb wiederhergestellt werden.")) return;
    setError("");
    setSaving(true);
    const { data, error } = await sb.from("questions").update({ deleted_at: new Date().toISOString() }).eq("id", editing.question.id).select();
    setSaving(false);
    if (error) {
      setError("Löschen fehlgeschlagen: " + error.message);
      return;
    }
    if (!data || data.length === 0) {
      setError("Die Frage wurde nicht gelöscht (fehlende Berechtigung?).");
      return;
    }
    onDone();
  }

  return (
    <div className="fdv-card">
      <span className="fdv-type-tag">{editing ? "Frage bearbeiten" : "Neue Frage"}</span>
      <form onSubmit={submit}>
        <label className="fdv-label">Kapitel</label>
        <select className="fdv-input" value={chapterCode} onChange={(e) => setChapterCode(e.target.value)}>
          {chapters.map((c) => (
            <option key={c.code} value={c.code}>{c.code} – {c.title}</option>
          ))}
        </select>

        <label className="fdv-label">Fragetyp</label>
        <select className="fdv-input" value={type} onChange={(e) => changeType(e.target.value)}>
          <option value="sc">Single Choice</option>
          <option value="ms">Multiple Select</option>
          <option value="tf">Wahr / Falsch</option>
          <option value="tfm">Wahr/Falsch-Matrix</option>
          <option value="matching">Zuordnung</option>
        </select>

        <label className="fdv-label">{type === "tf" ? "Aussage" : "Frage"}</label>
        <textarea className="fdv-input" rows={2} value={prompt} onChange={(e) => setPrompt(e.target.value)} />

        <label className="fdv-label">Bild-URL (optional)</label>
        <input className="fdv-input" type="text" placeholder="https://…" value={image} onChange={(e) => setImage(e.target.value)} />

        {type === "sc" && (
          <>
            <label className="fdv-label">Antwortoptionen (richtige markieren)</label>
            {form.options.map((opt, i) => (
              <div className="fdv-form-row" key={i}>
                <input
                  type="radio"
                  name="sc-correct"
                  checked={form.correctIndex === i}
                  onChange={() => setForm({ ...form, correctIndex: i })}
                />
                <input
                  className="fdv-input"
                  value={opt}
                  placeholder={`Option ${i + 1}`}
                  onChange={(e) => {
                    const options = [...form.options];
                    options[i] = e.target.value;
                    setForm({ ...form, options });
                  }}
                />
              </div>
            ))}
          </>
        )}

        {type === "ms" && (
          <>
            <label className="fdv-label">Antwortoptionen (alle richtigen ankreuzen)</label>
            {form.options.map((opt, i) => (
              <div className="fdv-form-row" key={i}>
                <input
                  type="checkbox"
                  checked={form.correctFlags[i]}
                  onChange={(e) => {
                    const correctFlags = [...form.correctFlags];
                    correctFlags[i] = e.target.checked;
                    setForm({ ...form, correctFlags });
                  }}
                />
                <input
                  className="fdv-input"
                  value={opt}
                  placeholder={`Option ${i + 1}`}
                  onChange={(e) => {
                    const options = [...form.options];
                    options[i] = e.target.value;
                    setForm({ ...form, options });
                  }}
                />
              </div>
            ))}
          </>
        )}

        {type === "tf" && (
          <>
            <label className="fdv-label">Richtige Antwort</label>
            <div className="fdv-form-row">
              <label><input type="radio" name="tf" checked={form.correct === true} onChange={() => setForm({ correct: true })} /> Wahr</label>
              <label><input type="radio" name="tf" checked={form.correct === false} onChange={() => setForm({ correct: false })} /> Falsch</label>
            </div>
          </>
        )}

        {type === "tfm" && (
          <>
            <label className="fdv-label">Teilaussagen</label>
            {form.statements.map((s, i) => (
              <div className="fdv-form-row" key={i}>
                <input
                  className="fdv-input"
                  value={s.text}
                  placeholder={`Aussage ${i + 1}`}
                  onChange={(e) => {
                    const statements = [...form.statements];
                    statements[i] = { ...statements[i], text: e.target.value };
                    setForm({ ...form, statements });
                  }}
                />
                <select
                  className="fdv-input fdv-input-narrow"
                  value={s.correct ? "wahr" : "falsch"}
                  onChange={(e) => {
                    const statements = [...form.statements];
                    statements[i] = { ...statements[i], correct: e.target.value === "wahr" };
                    setForm({ ...form, statements });
                  }}
                >
                  <option value="wahr">Wahr</option>
                  <option value="falsch">Falsch</option>
                </select>
              </div>
            ))}
          </>
        )}

        {type === "matching" && (
          <>
            <label className="fdv-label">Paare (links → rechts)</label>
            {form.pairs.map((p, i) => (
              <div className="fdv-form-row" key={i}>
                <input
                  className="fdv-input"
                  value={p.left}
                  placeholder={`Links ${i + 1}`}
                  onChange={(e) => {
                    const pairs = [...form.pairs];
                    pairs[i] = { ...pairs[i], left: e.target.value };
                    setForm({ ...form, pairs });
                  }}
                />
                <input
                  className="fdv-input"
                  value={p.right}
                  placeholder={`Rechts ${i + 1}`}
                  onChange={(e) => {
                    const pairs = [...form.pairs];
                    pairs[i] = { ...pairs[i], right: e.target.value };
                    setForm({ ...form, pairs });
                  }}
                />
              </div>
            ))}
          </>
        )}

        <label className="fdv-label">Erklärung (optional)</label>
        <textarea className="fdv-input" rows={2} value={explanation} onChange={(e) => setExplanation(e.target.value)} />

        <label className="fdv-label">Quelle / Stand (optional)</label>
        <input
          className="fdv-input"
          type="text"
          placeholder="z.B. 300.5 Ziff. 3.4, gültig ab 14.12.2025"
          value={source}
          onChange={(e) => setSource(e.target.value)}
        />

        {error && <div className="fdv-form-error">{error}</div>}

        <div className="fdv-form-actions">
          <button type="button" className="fdv-result-btn" onClick={onCancel}>Abbrechen</button>
          <button type="submit" className="fdv-result-btn primary" disabled={saving}>
            {saving ? "Speichern …" : (editing ? "Änderungen speichern" : "Frage speichern")}
          </button>
        </div>
        {editing && (
          <button type="button" className="fdv-result-btn warn fdv-delete-btn" disabled={saving} onClick={remove}>
            In Papierkorb verschieben
          </button>
        )}
      </form>
    </div>
  );
}

// ---- Admin screen: trash / restore soft-deleted questions ----
function TrashScreen({ onCancel, onRestored }) {
  const [items, setItems] = useState(null);
  const [error, setError] = useState("");
  const [busyId, setBusyId] = useState(null);

  const load = useCallback(async () => {
    const { data, error } = await sb
      .from("questions")
      .select("*")
      .not("deleted_at", "is", null)
      .order("deleted_at", { ascending: false });
    if (error) setError("Laden fehlgeschlagen: " + error.message);
    setItems(data || []);
  }, []);

  useEffect(() => { load(); }, [load]);

  async function restore(id) {
    setBusyId(id);
    const { error } = await sb.from("questions").update({ deleted_at: null }).eq("id", id);
    setBusyId(null);
    if (error) { setError("Wiederherstellen fehlgeschlagen: " + error.message); return; }
    await load();
    onRestored();
  }

  async function purge(id) {
    if (!window.confirm("Endgültig löschen? Das kann nicht mehr rückgängig gemacht werden.")) return;
    setBusyId(id);
    const { error } = await sb.from("questions").delete().eq("id", id);
    setBusyId(null);
    if (error) { setError("Löschen fehlgeschlagen: " + error.message); return; }
    await load();
  }

  return (
    <div className="fdv-card">
      <span className="fdv-type-tag">Papierkorb</span>
      {error && <div className="fdv-form-error">{error}</div>}
      {items === null && <p className="fdv-sub">Lädt …</p>}
      {items && items.length === 0 && <p className="fdv-sub">Der Papierkorb ist leer.</p>}
      {items && items.length > 0 && (
        <div className="fdv-trash-list">
          {items.map((row) => (
            <div className="fdv-trash-item" key={row.id}>
              <div className="fdv-trash-meta">
                <span className="fdv-type-tag">{TYPE_LABEL[row.type] || row.type}</span>
                <span className="fdv-trash-chapter">{row.chapter_code}</span>
              </div>
              <div className="fdv-trash-prompt">{row.prompt}</div>
              <div className="fdv-form-actions">
                <button type="button" className="fdv-result-btn" disabled={busyId === row.id} onClick={() => purge(row.id)}>
                  Endgültig löschen
                </button>
                <button type="button" className="fdv-result-btn primary" disabled={busyId === row.id} onClick={() => restore(row.id)}>
                  Wiederherstellen
                </button>
              </div>
            </div>
          ))}
        </div>
      )}
      <button type="button" className="fdv-result-btn" style={{ marginTop: 16, width: "100%" }} onClick={onCancel}>
        Zurück
      </button>
    </div>
  );
}

// ---- Admin screen: reported questions ----
function ReportsScreen({ onCancel, onEdit }) {
  const [items, setItems] = useState(null);
  const [error, setError] = useState("");
  const [busyId, setBusyId] = useState(null);

  const load = useCallback(async () => {
    const { data, error } = await sb
      .from("question_reports")
      .select("*, questions(id, prompt, chapter_code, type)")

      .order("created_at", { ascending: false });

    setItems(data || []);
  }, []);

  useEffect(() => { load(); }, [load]);

  async function resolve(id) {
    setBusyId(id);
    const { error } = await sb.from("question_reports").update({ resolved: true }).eq("id", id);
    setBusyId(null);
    if (error) { setError("Konnte nicht als erledigt markiert werden: " + error.message); return; }

  return (
    <div className="fdv-card">
      <span className="fdv-type-tag">Gemeldete Fragen</span>

      {items && items.length === 0 && <p className="fdv-sub">Keine offenen Meldungen.</p>}
      {items && items.length > 0 && (
        <div className="fdv-trash-list">
          {items.map((r) => (
            <div className="fdv-trash-item" key={r.id}>

                {r.questions && <span className="fdv-type-tag">{TYPE_LABEL[r.questions.type] || r.questions.type}</span>}

              <div className="fdv-trash-prompt">{r.questions ? r.questions.prompt : "(Frage wurde inzwischen gelöscht)"}</div>
              {r.note && <div className="fdv-explanation" style={{ marginTop: 0, paddingTop: 0, borderTop: "none" }}><strong>Hinweis:</strong> {r.note}</div>}
              <div className="fdv-form-actions">
                <button type="button" className="fdv-result-btn" disabled={busyId === r.id} onClick={() => resolve(r.id)}>

                  <button type="button" className="fdv-result-btn primary" disabled={busyId === r.id} onClick={() => onEdit(r.questions.id)}>
                    Frage bearbeiten

            </div>
          ))}
        </div>
      )}
      <button type="button" className="fdv-result-btn" style={{ marginTop: 16, width: "100%" }} onClick={onCancel}>
        Zurück
      </button>
    </div>
  );
}

// ---- Main app ----
function FdvTrainerCloud() {
  const [session, setSession] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [chapters, setChapters] = useState([]);
  const [progress, setProgress] = useState({});
  const [dataLoaded, setDataLoaded] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [editingQ, setEditingQ] = useState(null);
  const [screen, setScreen] = useState("home");
  const [session_, setSessionQuiz] = useState(null); // quiz session
  const [draft, setDraft] = useState(null);
  const [revealed, setRevealed] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => {
      setSession(data.session);
      setAuthChecked(true);
    });
    const { data: listener } = sb.auth.onAuthStateChange((_event, sess) => {
      setSession(sess);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  const [offlineMode, setOfflineMode] = useState(false);

  const loadData = useCallback(async (userId) => {
    setDataLoaded(false);
    const cacheKey = "lernlok-cache-" + userId;
    let chapterRows, questionRows, progressRows, adminRow;
    let failed = false;

    try {
      const [chaptersRes, questionsRes, progressRes, adminRes] = await Promise.all([
        sb.from("chapters").select("*").order("sort_order").order("code"),
        sb.from("questions").select("*").is("deleted_at", null),
        sb.from("progress").select("*").eq("user_id", userId),
        sb.from("app_admins").select("user_id").eq("user_id", userId).maybeSingle(),
      ]);
      if (chaptersRes.error || questionsRes.error || progressRes.error) failed = true;
      chapterRows = chaptersRes.data;
      questionRows = questionsRes.data;
      progressRows = progressRes.data;
      adminRow = adminRes.data;
    } catch (e) {
      failed = true;
    }

    let usedOffline = false;
    if (failed || !chapterRows) {
      // Kein Netz oder Supabase nicht erreichbar: letzten erfolgreich geladenen Stand aus dem Browser nehmen.
      try {
        const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
        if (cached) {
          chapterRows = cached.chapterRows;
          questionRows = cached.questionRows;
          progressRows = cached.progressRows;
          adminRow = cached.adminRow;
          usedOffline = true;
        }
      } catch (e) {
        /* kein nutzbarer Offline-Stand vorhanden */
      }
    } else {
      try {
        localStorage.setItem(cacheKey, JSON.stringify({ chapterRows, questionRows, progressRows, adminRow }));
      } catch (e) {
        /* Speichern für Offline-Nutzung fehlgeschlagen, kein Problem für den aktuellen Aufruf */
      }
    }

    setOfflineMode(usedOffline);

    const byChapter = {};
    (chapterRows || []).forEach((c) => {
      byChapter[c.code] = { code: c.code, title: c.title, questions: [] };
    });
    (questionRows || []).forEach((row) => {
      const q = rowToQuestion(row);
      if (byChapter[row.chapter_code]) byChapter[row.chapter_code].questions.push(q);
    });
    const orderedChapters = (chapterRows || []).map((c) => byChapter[c.code]);

    const progressMap = {};
    (progressRows || []).forEach((p) => {
      progressMap[p.question_id] = p;
    });

    setChapters(orderedChapters);
    setProgress(progressMap);
    setIsAdmin(!!adminRow);
    setDataLoaded(true);
    return orderedChapters;
  }, []);

  useEffect(() => {
    if (session && session.user) {
      loadData(session.user.id);
    }
  }, [session, loadData]);

  const allQuestions = useMemo(() => chapters.flatMap((c) => c.questions), [chapters]);
  const wrongCount = useMemo(
    () => allQuestions.filter((q) => progress[q.id] && progress[q.id].last_correct === false).length,
    [allQuestions, progress]
  );
  const totalAttempted = useMemo(() => allQuestions.filter((q) => progress[q.id]).length, [allQuestions, progress]);

  function loadQuestion(q) {
    setDraft(initDraft(q));
    setRevealed(false);
  }
  function beginSession(title, code, questions) {
    const qs = shuffledCopy(questions).map(randomizeQuestion);
    setSessionQuiz({ title, code, questions: qs, index: 0, correctCount: 0, answers: {}, results: {} });
    loadQuestion(qs[0]);
    setScreen("quiz");
  }
  function startChapter(chapter) { beginSession(chapter.title, chapter.code, chapter.questions); }
  function startMixed() { beginSession("Zufallstraining", null, shuffledCopy(allQuestions).slice(0, 15)); }
  function startReview() {
    const wrong = allQuestions.filter((q) => progress[q.id] && progress[q.id].last_correct === false);
    beginSession("Fehler wiederholen", null, wrong);
  }

  async function check() {
    const q = session_.questions[session_.index];
    const correct = isDraftCorrect(q, draft);
    setRevealed(true);
    const prior = progress[q.id] || { attempts: 0, correct_count: 0 };
    const nextRow = {
      user_id: session.user.id,
      question_id: q.id,
      attempts: prior.attempts + 1,
      correct_count: prior.correct_count + (correct ? 1 : 0),
      last_correct: correct,
      updated_at: new Date().toISOString(),
    };
    setProgress((p) => ({ ...p, [q.id]: nextRow }));
    setSessionQuiz((s) => {
      const results = { ...s.results, [q.id]: correct };
      const answers = { ...s.answers, [q.id]: draft };
      return { ...s, results, answers, correctCount: s.questions.filter((x) => results[x.id]).length };
    });
    try {
      await sb.from("progress").upsert(nextRow);
    } catch (e) {
      /* Offline: Fortschritt wird lokal angezeigt, aber erst beim nächsten Online-Start synchronisiert. */
    }
  }

  // Show a question: restore the saved answer (read-only review) if it was already answered.
  function openQuestion(q, answers) {
    const saved = answers && answers[q.id];
    if (saved) {
      setDraft(saved);
      setRevealed(true);
    } else {
      loadQuestion(q);
    }
  }

  function next() {
    if (session_.index + 1 >= session_.questions.length) {
      setScreen("result");
    } else {
      const nextIndex = session_.index + 1;
      setSessionQuiz((s) => ({ ...s, index: nextIndex }));
      openQuestion(session_.questions[nextIndex], session_.answers);
    }
  }

  function goBack() {
    if (!session_ || session_.index <= 0) return;
    const newIndex = session_.index - 1;
    setSessionQuiz((s) => ({ ...s, index: newIndex }));
    openQuestion(session_.questions[newIndex], session_.answers);
  }
  async function reportQuestion(qId) {
    const note = window.prompt("Was stimmt an dieser Frage nicht? (optional, kann auch leer bleiben)");
    if (note === null) return; // Abbrechen gedrückt
    try {
      const { error } = await sb.from("question_reports").insert({
        question_id: qId,
        reported_by: session.user.id,
        note: note.trim(),
      });
      if (error) {
        window.alert("Melden fehlgeschlagen: " + error.message);
        return;
      }
      window.alert("Danke, die Frage wurde gemeldet.");
    } catch (e) {
      window.alert("Melden fehlgeschlagen. Bitte später erneut versuchen.");
    }
  }

  function startEdit(qId) {
    const chapter = chapters.find((c) => c.questions.some((x) => x.id === qId));
    const question = chapter && chapter.questions.find((x) => x.id === qId);
    if (!question) return;
    setEditingQ({ question, chapterCode: chapter.code });
    setScreen("edit");
  }

  function goHome() {
    setSessionQuiz(null);
    setDraft(null);
    setRevealed(false);
    setScreen("home");
  }
  async function logout() {
    await sb.auth.signOut();
    setSession(null);
    setChapters([]);
    setProgress({});
    setScreen("home");
  }

  if (!authChecked) {
    return <div className="fdv-app"><p className="fdv-sub">Lädt …</p></div>;
  }
  if (!session) {
    return <LoginScreen onLoggedIn={setSession} />;
  }
  if (session.user.user_metadata && session.user.user_metadata.must_change_password) {
    return (
      <ForcePasswordChangeScreen
        onDone={async () => {
          const { data } = await sb.auth.getSession();
          setSession(data.session);
        }}
      />
    );
  }
  if (!dataLoaded) {
    return <div className="fdv-app"><p className="fdv-sub">Fragen werden geladen …</p></div>;
  }

  const currentQ = session_ && session_.questions.length > 0 ? session_.questions[session_.index] : null;
  const draftComplete = currentQ && draft ? isDraftComplete(currentQ, draft) : false;
  const needsCheckButton = currentQ && ["ms", "tfm", "matching"].includes(currentQ.type);

  return (
    <div className="fdv-app">
      {screen === "home" && (
        <>
          <div className="fdv-header">
            <h1 className="fdv-title">LernLok</h1>
            <button className="fdv-back-btn" onClick={logout}>Abmelden</button>
          </div>
          <p className="fdv-sub">
            {session.user.email} · {totalAttempted}/{allQuestions.length} Fragen geübt
          </p>
          {offlineMode && (
            <div className="fdv-offline-banner">
              Offline – zeigt den zuletzt geladenen Stand. Neue Fragen und dein Fortschritt werden synchronisiert, sobald wieder Internet verfügbar ist.
            </div>
          )}
          <div className="fdv-railline" />

          <div className="fdv-training-row">
            <button className="fdv-training-btn" onClick={startMixed}>
              <span className="label">Zufallstraining</span>
              <span className="meta">15 gemischte Fragen</span>
            </button>
            <button className={"fdv-training-btn" + (wrongCount === 0 ? " disabled" : "")} onClick={startReview}>
              <span className="label">Fehler wiederholen</span>
              <span className="meta">{wrongCount} offen</span>
            </button>
          </div>

          {isAdmin && (
            <button className="fdv-add-btn" onClick={() => setScreen("add")}>+ Neue Frage hinzufügen</button>
          )}
          {isAdmin && (
            <button className="fdv-add-btn" onClick={() => setScreen("adduser")}>+ Neuen Nutzer hinzufügen</button>
          )}
          {isAdmin && (
            <button className="fdv-add-btn" onClick={() => setScreen("trash")}>🗑 Papierkorb</button>
          )}
          {isAdmin && (
            <button className="fdv-add-btn" onClick={() => setScreen("reports")}>🚩 Gemeldete Fragen</button>
          )}

          <div className="fdv-section-label">Kapitel</div>
          <div className="fdv-chapter-list">
            {chapters.map((chapter) => {
              const stats = chapterStats(chapter, progress);
              const color = masteryColor(stats);
              return (
                <button key={chapter.code} className="fdv-chapter-row" onClick={() => startChapter(chapter)}>
                  <span className="fdv-chapter-code">{chapter.code}</span>
                  <span className="fdv-chapter-title">{chapter.title}</span>
                  <span className="fdv-mastery">
                    <span className="fdv-mastery-dot" style={{ background: color }} />
                    <span className="fdv-mastery-text">{stats.attempted}/{stats.total}</span>
                  </span>
                </button>
              );
            })}
          </div>
        </>
      )}

      {screen === "add" && isAdmin && (
        <>
          <div className="fdv-quiz-top">
            <button className="fdv-back-btn" onClick={() => setScreen("home")}>Zurück</button>
            <span className="fdv-quiz-title">Neue Frage</span>
          </div>
          <AddQuestionScreen
            chapters={chapters}
            userId={session.user.id}
            onCancel={() => setScreen("home")}
            onDone={async () => {
              await loadData(session.user.id);
              setScreen("home");
            }}
          />
        </>
      )}

      {screen === "adduser" && isAdmin && (
        <>
          <div className="fdv-quiz-top">
            <button className="fdv-back-btn" onClick={() => setScreen("home")}>Zurück</button>
            <span className="fdv-quiz-title">Neuer Nutzer</span>
          </div>
          <AddUserScreen
            accessToken={session.access_token}
            onCancel={() => setScreen("home")}
          />
        </>
      )}

      {screen === "trash" && isAdmin && (
        <>
          <div className="fdv-quiz-top">
            <button className="fdv-back-btn" onClick={() => setScreen("home")}>Zurück</button>
            <span className="fdv-quiz-title">Papierkorb</span>
          </div>
          <TrashScreen
            onCancel={() => setScreen("home")}
            onRestored={() => loadData(session.user.id)}
          />
        </>
      )}

      {screen === "reports" && isAdmin && (
        <>
          <div className="fdv-quiz-top">
            <button className="fdv-back-btn" onClick={() => setScreen("home")}>Zurück</button>
            <span className="fdv-quiz-title">Gemeldete Fragen</span>
          </div>
          <ReportsScreen
            onCancel={() => setScreen("home")}
            onEdit={(qId) => startEdit(qId)}
          />
        </>
      )}

      {screen === "edit" && isAdmin && editingQ && (
        <>
          <div className="fdv-quiz-top">
            <button className="fdv-back-btn" onClick={() => setScreen(session_ ? "quiz" : "home")}>Zurück</button>
            <span className="fdv-quiz-title">Frage bearbeiten</span>
          </div>
          <AddQuestionScreen
            chapters={chapters}
            userId={session.user.id}
            editing={editingQ}
            onCancel={() => setScreen(session_ ? "quiz" : "home")}
            onDone={async () => {
              const qId = editingQ.question.id;
              const fresh = await loadData(session.user.id);
              setEditingQ(null);
              if (!fresh || fresh.length === 0) {
                goHome();
                return;
              }
              const edited = fresh.flatMap((c) => c.questions).find((x) => x.id === qId);
              if (session_) {
                const idx = session_.questions.findIndex((x) => x.id === qId);
                if (idx >= 0) {
                  let questions = [...session_.questions];
                  const answers = { ...session_.answers };
                  const results = { ...session_.results };
                  delete answers[qId];
                  delete results[qId];
                  let newIndex = idx;
                  if (edited) {
                    // edited: put the corrected version back so it can be answered again
                    questions[idx] = randomizeQuestion(edited);
                  } else {
                    // deleted: drop it from the running session
                    questions = questions.filter((x) => x.id !== qId);
                    if (questions.length === 0) {
                      goHome();
                      return;
                    }
                    newIndex = Math.min(idx, questions.length - 1);
                  }
                  const correctCount = questions.filter((x) => results[x.id]).length;
                  setSessionQuiz({ ...session_, questions, answers, results, correctCount, index: newIndex });
                  openQuestion(questions[newIndex], answers);
                  setScreen("quiz");
                  return;
                }
              }
              goHome();
            }}
          />
        </>
      )}

      {screen === "quiz" && session_ && (
        <>
          <div className="fdv-quiz-top">
            <button className="fdv-back-btn" onClick={goHome}>Zurück</button>
            <span className="fdv-quiz-title">{session_.title}{session_.code ? " · " + session_.code : ""}</span>
            <span className="fdv-quiz-title" style={{ flex: "none", textAlign: "right" }}>
              {session_.index + 1}/{session_.questions.length}
            </span>
          </div>
          <div className="fdv-progress-track">
            {session_.questions.map((q, i) => {
              let cls = "fdv-progress-tick";
              if (i === session_.index) cls += " current";
              else if (session_.results && session_.results[q.id] !== undefined) {
                cls += session_.results[q.id] ? " correct" : " wrong";
              }
              return <div key={q.id} className={cls} />;
            })}
          </div>

          {!currentQ ? (
            <div className="fdv-card">
              <p className="fdv-question">Keine Fragen in dieser Auswahl.</p>
              <button className="fdv-next-btn" onClick={goHome}>Zurück zur Übersicht</button>
            </div>
          ) : (
            <div className="fdv-card">
              <div className="fdv-card-head">
                <span className="fdv-type-tag">{TYPE_LABEL[currentQ.type] || currentQ.type}</span>
                <span className="fdv-card-head-actions">
                  {isAdmin && (
                    <button type="button" className="fdv-link-btn" onClick={() => startEdit(currentQ.id)}>
                      Bearbeiten
                    </button>
                  )}
                  <button type="button" className="fdv-link-btn" onClick={() => reportQuestion(currentQ.id)}>
                    🚩 Melden
                  </button>
                </span>
              </div>
              {currentQ.source && <div className="fdv-source-tag">Quelle: {currentQ.source}</div>}
              {currentQ.image && (
                <img className="fdv-question-image" src={currentQ.image} alt="" onError={(e) => { e.target.style.display = "none"; }} />
              )}
              <p className="fdv-question">{currentQ.prompt}</p>
              <QuestionBody q={currentQ} draft={draft} setDraft={(d) => setDraft({ ...draft, ...d })} revealed={revealed} />

              {!revealed && needsCheckButton && (
                <button className={"fdv-check-btn" + (draftComplete ? " enabled" : "")} disabled={!draftComplete} onClick={check}>
                  Prüfen
                </button>
              )}
              {!revealed && !needsCheckButton && draftComplete && (
                <button className="fdv-check-btn enabled" onClick={check}>Prüfen</button>
              )}

              {revealed && (
                <>
                  {currentQ.explanation && (
                    <div className="fdv-explanation">
                      <strong>{isDraftCorrect(currentQ, draft) ? "Richtig." : "Nicht ganz."}</strong> {currentQ.explanation}
                    </div>
                  )}
                  <div className="fdv-nav-row">
                    {session_.index > 0 && (
                      <button type="button" className="fdv-prev-btn" onClick={goBack}>
                        ‹ Vorherige
                      </button>
                    )}
                    <button className="fdv-next-btn" onClick={next}>
                      {session_.index + 1 >= session_.questions.length ? "Auswertung ansehen" : "Weiter"}
                    </button>
                  </div>
                </>
              )}
            </div>
          )}
        </>
      )}

      {screen === "result" && session_ && (
        <div className="fdv-card" style={{ textAlign: "center", marginTop: 40 }}>
          <div className="fdv-quiz-title" style={{ textAlign: "center" }}>{session_.title}</div>
          <div
            className="fdv-result-score"
            style={{
              color:
                session_.questions.length === 0 ? "var(--text)" :
                session_.correctCount / session_.questions.length >= 0.8 ? "var(--green)" :
                session_.correctCount / session_.questions.length >= 0.5 ? "var(--amber)" : "var(--red)",
            }}
          >
            {session_.correctCount}/{session_.questions.length}
          </div>
          <div className="fdv-result-sub">richtig beantwortet</div>
          <div className="fdv-result-actions">
            {session_.code && (
              <button className="fdv-result-btn" onClick={() => { const chapter = chapters.find((c) => c.code === session_.code); startChapter(chapter); }}>
                Kapitel wiederholen
              </button>
            )}
            {wrongCount > 0 && <button className="fdv-result-btn warn" onClick={startReview}>Fehler wiederholen ({wrongCount})</button>}
            <button className="fdv-result-btn primary" onClick={goHome}>Zur Übersicht</button>
          </div>
        </div>
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<FdvTrainerCloud />);

</script>
</body>
</html>
